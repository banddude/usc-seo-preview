name: Validate and deploy USC preview

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: usc-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Lint preview changes
        run: npx eslint app/components/EditorialPage.tsx app/components/InlineCopy.tsx app/components/PreviewImage.tsx app/lib/preview.ts app/fashion-film-production/page.tsx app/fashion-film-production-cost/page.tsx app/services/page.tsx app/services/metadata.ts app/robots.ts next.config.ts scripts/prepare-preview.mjs
      - name: Type check
        run: npx tsc --noEmit
      - name: Build static site and verify preview safeguards
        run: npm run build
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out
          retention-days: 1

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy separate preview
        id: deployment
        uses: actions/deploy-pages@v4
